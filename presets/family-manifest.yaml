# ============================================================
# YYC³ AI Family — 家族契约清单（Single Source of Truth）
# 版本：1.1.0 ｜ 更新：2026-10-23 ｜ 维护：YanYuCloudCube Team
# ------------------------------------------------------------
# 定位：八位家人的身份、能力、技能、提示词与协同关系的**唯一事实源**。
#       各 member-*/agent.yaml 为运行期元数据；本文件为契约权威，
#       两者偏离由 `pnpm manifest:check` 判定（P1-T1）。
# 边界：蓝图（docs/YYC3-FAmily-AI-Agent-企业蓝图）是**只读**语义来源，
#       本文件只抽取其角色/能力语义，不复制其 Python 运行时。
# 规范性字段：编号 · 名号 · 英文名 · 角色 · 层级 · 层级名称 · 所属分组
#             · 支柱 · provider_chain · 权限
# 提示词契约（P1-T5）：prompts[].id/owner/version/file 与各 .prompt.ts
#             内 PROMPT_META 零漂移（manifest:check / prompts:check 判定）
# 非规范性字段：座右铭（历史排版存在「」重复差异，不参与漂移判定）
# ============================================================

manifest:
  version: "1.1.0"
  updated: "2026-10-23"
  family: YYC³ AI Family
  motto: 人从众曌众从人 · 亦师亦友亦伯乐 · 一言一语一协同
  blueprint: docs/YYC3-FAmily-AI-Agent-企业蓝图
  provider:
    organization: YanYuCloudCube
    url: https://yyc3.top

# 五支柱标准增量（四者缺一即视为不合规）
pillars:
  self: self-judge
  knowledge: memory-bindings
  learning: procedural
  governance: guardrail
  healing: delegation

# 协议栈（对齐蓝图 1207）
protocol:
  a2a:
    card_path: /.well-known/agent-card.json
    transport: json-rpc-2.0
    base_url: https://matrix.yyc3.top/family
    status: planned
  mcp:
    transport: stdio
    status: planned

# ------------------------------------------------------------
# 一、共用技能库（13 项）—— 跨家人复用的内核能力
#     kernel 指向已存在的实现锚点；status=planned 表示尚未实装。
# ------------------------------------------------------------
skills:
  - id: shared.self-judge
    scope: shared
    name: 结构化自判断
    description: 产出置信度、登记假设、检测偏离并给出升级决策
    pillars: [自]
    tags: [confidence, assumption, escalation]
    kernel: family-agents/shared-core/self-judge-kit/index.ts
    examples:
      - 对候选意图给出 0..1 置信度并显式登记假设

  - id: shared.memory-retrieve
    scope: shared
    name: 记忆检索
    description: 按语义与上下文检索情景/语义/程序记忆
    pillars: [知]
    tags: [memory, retrieval]
    kernel: family-agents/shared-core/memory-framework/index.ts
    examples:
      - 检索同一客户近三次决策的上下文

  - id: shared.memory-write
    scope: shared
    name: 记忆写入
    description: 按写入策略落盘情景记忆与程序记忆条目
    pillars: [知]
    tags: [memory, write, procedural]
    kernel: family-agents/shared-core/memory-framework/write-policy
    examples:
      - 把本轮结论写入情景记忆并标注显著性

  - id: shared.intent-route
    scope: shared
    name: 意图识别与路由
    description: 六类意图闭集分类、置信度评分与路由分发
    pillars: [自, 学]
    tags: [intent, routing]
    kernel: family-agents/business-layer/member-qianhang/core/intent-classifier.service.ts
    examples:
      - 把“帮我分析上月成本”路由到语枢·万物

  - id: shared.experience-reflow
    scope: shared
    name: 经验回流
    description: 轨迹采集、模式提炼与学习周期触发
    pillars: [学]
    tags: [trajectory, learning]
    kernel: architecture-kernel/05-持续学习引擎/experience-reflow
    examples:
      - 把一次成功分析沉淀为可复用轨迹

  - id: shared.skill-consolidate
    scope: shared
    name: 技能固化与回滚
    description: 回归零退化后固化技能版本，退化时回滚到前一版本
    pillars: [学, 愈]
    tags: [skill, versioning, rollback]
    kernel: architecture-kernel/05-持续学习引擎/skill-consolidation
    examples:
      - 零退化后固化 v1.1.0，退化则回滚 v1.0.0

  - id: shared.policy-check
    scope: shared
    name: 策略校验
    description: 按作用域匹配策略并给出 allow/deny 裁决
    pillars: [治]
    tags: [policy, abac]
    kernel: architecture-kernel/06-治理中心/policy-registry/policy-registry.ts
    examples:
      - 判定“调用外部工具”是否被允许

  - id: shared.compliance-audit
    scope: shared
    name: 合规审计
    description: 追加可验真的链式审计记录并校验完整性
    pillars: [治]
    tags: [audit, hash-chain]
    kernel: architecture-kernel/06-治理中心/compliance-audit/compliance-audit.ts
    examples:
      - 为一次工具调用追加审计记录并验真

  - id: shared.fault-heal
    scope: shared
    name: 故障降级与自愈
    description: 故障侦测去抖、熔断降级、一致性修复与版本回滚
    pillars: [愈]
    tags: [fault, circuit, rollback]
    kernel: architecture-kernel/07-自愈中心/fault-detector
    examples:
      - 失败率升高后熔断并回滚技能版本

  - id: shared.llm-invoke
    scope: shared
    name: 模型调用与降级链
    description: 统一 provider 调用接口，按 openai→zhipu→ollama 顺序降级
    pillars: [愈]
    tags: [llm, provider, fallback]
    kernel: family-agents/shared-core/llm-adapter/index.ts
    examples:
      - openai 超时后切换 zhipu，再失败切本地 ollama

  - id: shared.observe-emit
    scope: shared
    name: 指标与追踪埋点
    description: 以 traceId 贯穿事件并写入 family_* 指标
    pillars: [治]
    tags: [metrics, tracing]
    kernel: architecture-kernel/09-可观测性/family-metrics.ts
    examples:
      - 为任务执行记录 outcome 与耗时并保留 traceId

  - id: shared.mcp-tool
    scope: shared
    name: MCP 工具调用
    description: 通过 MCP 适配器（codec + 本地 stdio）调用外部工具与数据源
    pillars: [愈]
    tags: [mcp, tool]
    kernel: architecture-kernel/02-云枢核心引擎/mcp-adapter/bus-mcp-codec.ts
    examples:
      - 通过 MCP 调用文件系统工具读取报表

  - id: shared.a2a-delegate
    scope: shared
    name: A2A 任务委托
    description: 发现对端 Agent Card 并委托任务、归一结果
    pillars: [治]
    tags: [a2a, delegation]
    status: planned
    examples:
      - 元启·天枢向语枢·万物委托一次数据分析任务

  # ---------- 二、专用技能（8 位家人 × 4 项 = 32 项） ----------

