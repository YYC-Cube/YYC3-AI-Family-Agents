  healing: delegation         # 【愈】降级兜底（Ollama 本地兜底）

# Provider 降级链（对齐 §6.2 降级兜底）
provider_chain:
  - openai
  - zhipu
  - ollama

# 协同关系
协同:
  - 元启·天枢: 上报意图分类结果，触发任务编排
  - 语枢·万物: 转发数据分析请求，共享上下文
  - 预见·先知: 转发预测请求，传递时间序列数据
  - 千里·伯乐: 转发推荐请求，传递用户画像
  - 创想·灵韵: 转发创作请求，传递创意意图
  - 智云·守护: 异常对话检测，恶意意图识别

# 五维评估坐标（对齐家人档案）
评估:
  时间维: 意图识别延迟 < 200ms
  空间维: 上下文窗口 128K tokens
  属性维: 意图识别准确率 > 95%
  事件维: 交互事件全链路记录
  关联维: 分布式追踪 · 意图路由可视化
