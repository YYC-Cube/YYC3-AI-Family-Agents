# YYC³ AI Family · family-api 水平扩缩容骨架（min2 / max10 / CPU 70%）
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: family-api-hpa
  labels:
    app.kubernetes.io/part-of: yyc3-ai-family
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: family-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
