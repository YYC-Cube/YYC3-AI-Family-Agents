# YYC³ AI Family · Prometheus 抓取配置（v2.7.1，验收 L2 闭环）
# 两条数据通路：
#   1. 运行时指标：抓取 family runtime 的 /metrics（Bearer 鉴权，令牌走文件，不入库）；
#   2. CI 门禁指标：scripts/run-regression.mjs 产出 metrics.prom → scripts/push-metrics.mjs 推 Pushgateway，
#      本配置以 honor_labels 抓取 Pushgateway（保留 job/instance 标签，避免被覆盖）。
# 告警规则：prometheus-rules.yaml 与本次抓取同批挂载。
# 部署提示：METRICS_TOKEN_FILE 需与运行时 YYC3_METRICS_TOKEN 同值，文件权限 0400。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/prometheus-rules.yaml

scrape_configs:
  # ① 运行时指标（五支柱业务指标 family_*）
  - job_name: yyc3-family-runtime
    metrics_path: /metrics
    scheme: http
    bearer_token_file: /etc/prometheus/secrets/metrics-token
    static_configs:
      - targets: ["family-runtime:9464"]
        labels:
          env: production
          component: ai-family

  # ② CI 门禁指标（经 Pushgateway 中转）
  - job_name: yyc3-family-regression-gate
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets: ["pushgateway:9091"]
        labels:
          env: ci
          component: regression-gate

  # ③ Prometheus 自身健康（便于区分「无数据」与「采集异常」）
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
