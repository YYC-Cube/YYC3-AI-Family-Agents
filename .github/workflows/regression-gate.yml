# YYC³ AI Family · 回归门禁（防退化红线）
# 门禁命令：pnpm regression（scripts/run-regression.mjs 一体化：编译 → 全量 spec → 五支柱聚合 → 面板 → exit code）
# 面板产物：ops/observability/pillar-dashboard/（data.json + index.html，artifact 留存）

name: regression-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    name: 全量回归 + 五支柱面板
    runs-on: ubuntu-latest
    env:
      # L2 闭环：配置该 secret 后自动把门禁指标推送 Pushgateway；未配置则跳过
      PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm（版本取自 package.json packageManager）
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（门禁一）
        run: pnpm typecheck

      - name: 契约清单与提示词软校验（P1-T1/T2/T5 · P3-T2 技能产物 · P4-T1 能力包 · P4-T5 工具目录 · P4-T6 打包 CLI · P2-T1 外部 worker 契约 · P2-T4 安全策略 · 不阻断）
        continue-on-error: true
        run: |
          node scripts/check-manifest.mjs
          node scripts/gen-agent-cards.mjs --check
          node scripts/check-prompts.mjs
          node scripts/gen-skill-artifacts.mjs --check
          node scripts/check-plugins.mjs
          node scripts/gen-mcp-tools.mjs --check
          node scripts/pack-plugin.mjs --check
          node scripts/check-external-worker.mjs
          node scripts/check-security-policies.mjs

      - name: 全量回归 + 五支柱面板（门禁二）
        run: pnpm regression

      - name: 推送门禁指标至 Pushgateway（L2）
        if: env.PUSHGATEWAY_URL != ''
        run: node scripts/push-metrics.mjs

      - name: 上传面板产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pillar-dashboard
          path: ops/observability/pillar-dashboard/
          retention-days: 30
